services:
  # One-process image used by Railway / Render / Fly (UI + API on :8000)
  app:
    profiles: ["single"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/mission_control.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - mission-data:/data
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/mission_control.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - mission-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 8

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: spacex
      POSTGRES_PASSWORD: spacex
      POSTGRES_DB: spacex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  mission-data:
  pgdata:
